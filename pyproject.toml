[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferencesh"
version = "0.7.30"
description = "inference.sh Python SDK"
authors = [
    {name = "Inference Shell Inc.", email = "hello@inference.sh"},
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "tqdm>=4.67.0",
    # Required for the synchronous client and examples
    "requests>=2.33.0",
]

[project.urls]
"Homepage" = "https://github.com/inference-sh/sdk"
"Bug Tracker" = "https://github.com/inference-sh/sdk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v"]
asyncio_mode = "auto"

[tool.flake8]
max-line-length = 100
exclude = [".git", "__pycache__", "build", "dist"]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
    # Reference for the OpenAI spec-drift guard (tests/test_openai_spec_drift.py)
    "openai>=2.37.0",
]
async = [
    "aiohttp>=3.14.3; python_version >= '3.8'",
    "aiofiles>=23.2.1; python_version >= '3.8'",
]
