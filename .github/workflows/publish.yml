name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Add permissions needed for trusted publishing
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.x'
    # The build tools and the build backend come from a hash-locked file, and
    # the build runs with them (no isolated env that would fetch setuptools unpinned).
    - name: Install dependencies
      run: python -m pip install --require-hashes -r .github/requirements-build.txt
    # Replace twine upload with trusted publisher action
    - name: Build package
      run: python -m build --no-isolation
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3