name: Update Types

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Models version"
        required: true
      file:
        description: "Source file in models repo"
        required: true
      dest:
        description: "Destination path in this repo"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev

      - name: Fetch types from models
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
          FILE: ${{ inputs.file }}
          VERSION: ${{ inputs.version }}
          DEST: ${{ inputs.dest }}
        run: |
          gh api "repos/inference-sh/models/contents/${FILE}?ref=${VERSION}" \
            --jq .content | base64 -d > "$DEST"

      - name: Commit if changed
        env:
          VERSION: ${{ inputs.version }}
          DEST: ${{ inputs.dest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- "$DEST"; then
            echo "No changes to types"
            exit 0
          fi
          git add "$DEST"
          git commit -m "deps: update types from models $VERSION"
          git push origin dev
